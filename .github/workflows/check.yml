name: check

# Validates the marketplace and both mods and runs their tests on every pull
# request and every push to main. The "check" job is required to merge into main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned so a new Claude Code release can't change results unannounced.
      # Bump it on purpose, in its own PR.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.330

      - name: Validate marketplace
        run: claude plugin validate .

      - name: operator-board
        working-directory: operator-board
        run: |
          claude plugin validate .
          claude plugin test .

      - name: persona
        working-directory: persona
        run: |
          claude plugin validate .
          claude plugin test .
