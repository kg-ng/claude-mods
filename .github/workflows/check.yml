name: check

# Validates the marketplace and every mod and runs their tests on every pull
# request and every push to main. The "check" job is required to merge into main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version check compares with the base branch

      # A mod change that doesn't raise its version never reaches anyone: claude plugin
      # update skips it. Also wants a CHANGELOG.md entry for the new version.
      - name: Versions raised and in CHANGELOG
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_versions.py origin/${{ github.base_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned so a new Claude Code release can't change results unannounced.
      # Bump it on purpose, in its own PR.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.330

      - name: Validate marketplace
        run: claude plugin validate .

      # Every mod in the marketplace, so a new mod needs no change here. Validation must be
      # clean: "passed with warnings" covers type errors, and those fail the check too.
      - name: Mods
        run: |
          for mod in $(python3 -c "import json; print(' '.join(p['source'].lstrip('./') for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']))"); do
            echo "::group::$mod"
            out=$(claude plugin validate "$mod" 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            if echo "$out" | grep -q "passed with warnings"; then echo "::error::$mod: validation has warnings"; exit 1; fi
            (cd "$mod" && claude plugin test .)
            echo "::endgroup::"
          done

      # The Copilot CLI port: plain Node, no Copilot needed to test its storage.
      - name: copilot/operator-board
        run: |
          node --check copilot/operator-board/extension.mjs
          node --test copilot/operator-board/store.test.mjs
