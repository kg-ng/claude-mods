<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" role="img" aria-label="How the repo, its mods, the Copilot CLI port and Claude Code fit together" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<title>How the repo, its mods, the Copilot CLI port and Claude Code fit together</title>
<rect width="920" height="660" rx="12" fill="#1a1b26"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#737aa2"/></marker></defs>
<rect x="310" y="20" width="300" height="76" rx="8" fill="#20212d" stroke="#7aa2f7"/>
<text x="324" y="44" fill="#7aa2f7" font-weight="700">kg-ng/claude-mods</text>
<text x="324" y="68" fill="#c0caf5" font-size="13">GitHub repo = plugin marketplace</text>
<text x="324" y="88" fill="#c0caf5" font-size="13">.claude-plugin/marketplace.json</text>
<rect x="40" y="150" width="390" height="150" rx="8" fill="#20212d" stroke="#e0af68"/>
<text x="54" y="174" fill="#e0af68" font-weight="700">operator-board  0.18.1</text>
<text x="54" y="198" fill="#c0caf5" font-size="13">pane  /operator  (docked, sized to terminal)</text>
<text x="54" y="218" fill="#c0caf5" font-size="13">band  board · recall · PRs · alerts · crew</text>
<text x="54" y="238" fill="#c0caf5" font-size="13">tools  board_update · todo_update</text>
<text x="54" y="258" fill="#c0caf5" font-size="13">       checkpoint_save</text>
<text x="54" y="278" fill="#c0caf5" font-size="13">cmds  /board /prs /sessions /quick ...</text>
<rect x="490" y="150" width="390" height="150" rx="8" fill="#20212d" stroke="#bb9af7"/>
<text x="504" y="174" fill="#bb9af7" font-weight="700">persona  0.7.1</text>
<text x="504" y="198" fill="#c0caf5" font-size="13">24 built-in themes + your own .json</text>
<text x="504" y="218" fill="#c0caf5" font-size="13">replies, tool-row icons, spinner words</text>
<text x="504" y="238" fill="#c0caf5" font-size="13">terminal colours (16 ANSI + bg/fg)</text>
<text x="504" y="258" fill="#c0caf5" font-size="13">band + animated scene while working</text>
<text x="504" y="278" fill="#c0caf5" font-size="13">tool  design   cmd  /persona</text>
<rect x="240" y="360" width="440" height="90" rx="8" fill="#20212d" stroke="#9ece6a"/>
<text x="254" y="384" fill="#9ece6a" font-weight="700">Claude Code</text>
<text x="254" y="408" fill="#c0caf5" font-size="13">claude plugin marketplace add kg-ng/claude-mods</text>
<text x="254" y="428" fill="#c0caf5" font-size="13">claude plugin install &lt;mod&gt;@claude-mods</text>
<line x1="420" y1="96" x2="235" y2="148" stroke="#737aa2" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="96" x2="685" y2="148" stroke="#737aa2" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="235" y1="300" x2="390" y2="358" stroke="#737aa2" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="685" y1="300" x2="530" y2="358" stroke="#737aa2" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="490" width="470" height="104" rx="8" fill="#20212d" stroke="#73daca"/>
<text x="54" y="514" fill="#73daca" font-weight="700">copilot/operator-board</text>
<text x="54" y="538" fill="#c0caf5" font-size="13">GitHub Copilot CLI extension (no pane)</text>
<text x="54" y="558" fill="#c0caf5" font-size="13">tools  board_update · todo_update · checkpoint_save</text>
<text x="54" y="578" fill="#c0caf5" font-size="13">cmds  /board /todo /savepoint · status line</text>
<line x1="90" y1="300" x2="90" y2="488" stroke="#737aa2" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="100" y="398" fill="#737aa2" font-size="12">shares</text>
<text x="100" y="414" fill="#737aa2" font-size="12">~/.claude/</text>
<text x="100" y="430" fill="#737aa2" font-size="12">operator-board/</text>
<rect x="540" y="490" width="350" height="150" rx="8" fill="#20212d" stroke="#7aa2f7"/>
<text x="554" y="514" fill="#7aa2f7" font-weight="700">and five smaller mods  0.1.0</text>
<text x="554" y="538" fill="#c0caf5" font-size="13">guard · a seatbelt for shell commands</text>
<text x="554" y="558" fill="#c0caf5" font-size="13">diff-cards · each edit&#x27;s diff on one line</text>
<text x="554" y="578" fill="#c0caf5" font-size="13">turn-meter · tokens and cost per turn</text>
<text x="554" y="598" fill="#c0caf5" font-size="13">chimes · sounds for done, needs you, CI</text>
<text x="554" y="618" fill="#c0caf5" font-size="13">focus · a timer that holds alerts</text>
<line x1="700" y1="488" x2="620" y2="452" stroke="#737aa2" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
