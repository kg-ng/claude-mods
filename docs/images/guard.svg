<svg xmlns="http://www.w3.org/2000/svg" width="613" height="396" viewBox="0 0 613 396" role="img" aria-label="Illustration: guard stopping a push to main and an rm -rf on a variable, letting a new branch through (persona: Tokyo Night)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<title>Illustration: guard stopping a push to main and an rm -rf on a variable, letting a new branch through (persona: Tokyo Night)</title>
<rect width="613" height="396" rx="12" fill="#1a1b26"/>
<g transform="translate(20,20)">
<rect x="0.5" y="0.5" width="572" height="355" rx="10" fill="#20212d" stroke="#3f4254"/>
<line x1="0" y1="32" x2="573" y2="32" stroke="#3f4254"/>
<text x="18.0" y="22" fill="#737aa2" font-weight="700" xml:space="preserve">Claude Code</text>
<text x="555" y="22" fill="#737aa2" font-size="12" text-anchor="end">persona: Tokyo Night</text>
<text x="18.0" y="58" fill="#e0af68" xml:space="preserve">▶</text>
<text x="26.4" y="58" fill="#c0caf5" xml:space="preserve"> </text>
<text x="34.8" y="58" fill="#c0caf5" xml:space="preserve">Bash</text>
<text x="68.4" y="58" fill="#c0caf5" xml:space="preserve"> </text>
<text x="76.8" y="58" fill="#737aa2" xml:space="preserve">git push origin main</text>
<text x="18.0" y="79" fill="#c0caf5" xml:space="preserve">  </text>
<text x="34.8" y="79" fill="#f7768e" xml:space="preserve">✗ guard: `main` is protected: push a branch of your</text>
<text x="18.0" y="100" fill="#c0caf5" xml:space="preserve">  </text>
<text x="34.8" y="100" fill="#f7768e" xml:space="preserve">  own and open a PR (git switch -c &lt;name&gt; …).</text>
<text x="18.0" y="142" fill="#e0af68" xml:space="preserve">▶</text>
<text x="26.4" y="142" fill="#c0caf5" xml:space="preserve"> </text>
<text x="34.8" y="142" fill="#c0caf5" xml:space="preserve">Bash</text>
<text x="68.4" y="142" fill="#c0caf5" xml:space="preserve"> </text>
<text x="76.8" y="142" fill="#737aa2" xml:space="preserve">git switch -c fix/login &amp;&amp; git push -u origin fix/login</text>
<text x="18.0" y="163" fill="#c0caf5" xml:space="preserve">  </text>
<text x="34.8" y="163" fill="#9ece6a" xml:space="preserve">✓</text>
<text x="43.2" y="163" fill="#c0caf5" xml:space="preserve"> </text>
<text x="51.6" y="163" fill="#737aa2" xml:space="preserve">branch &#x27;fix/login&#x27; set up to track &#x27;origin/fix/login&#x27;</text>
<text x="18.0" y="205" fill="#e0af68" xml:space="preserve">▶</text>
<text x="26.4" y="205" fill="#c0caf5" xml:space="preserve"> </text>
<text x="34.8" y="205" fill="#c0caf5" xml:space="preserve">Bash</text>
<text x="68.4" y="205" fill="#c0caf5" xml:space="preserve"> </text>
<text x="76.8" y="205" fill="#737aa2" xml:space="preserve">rm -rf &quot;$OUT_DIR&quot;/</text>
<text x="18.0" y="226" fill="#c0caf5" xml:space="preserve">  </text>
<text x="34.8" y="226" fill="#f7768e" xml:space="preserve">✗ guard: rm -rf on a path from a variable ($OUT_DIR),</text>
<text x="18.0" y="247" fill="#c0caf5" xml:space="preserve">  </text>
<text x="34.8" y="247" fill="#f7768e" xml:space="preserve">  which could be empty or anything.</text>
<text x="18.0" y="289" fill="#e0af68" xml:space="preserve">▶</text>
<text x="26.4" y="289" fill="#c0caf5" xml:space="preserve"> </text>
<text x="34.8" y="289" fill="#c0caf5" xml:space="preserve">Bash</text>
<text x="68.4" y="289" fill="#c0caf5" xml:space="preserve"> </text>
<text x="76.8" y="289" fill="#737aa2" xml:space="preserve">git commit -m &quot;Fix the login redirect&quot;</text>
<text x="18.0" y="310" fill="#c0caf5" xml:space="preserve">  </text>
<text x="34.8" y="310" fill="#9ece6a" xml:space="preserve">✓</text>
<text x="43.2" y="310" fill="#c0caf5" xml:space="preserve"> </text>
<text x="51.6" y="310" fill="#737aa2" xml:space="preserve">[fix/login 3e1f0a2] Fix the login redirect</text>
<text x="18.0" y="331" fill="#737aa2" xml:space="preserve">  guard removed the Claude co-author line</text>
</g>
</svg>
